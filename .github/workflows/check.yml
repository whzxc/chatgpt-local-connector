name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm run release:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: cargo check --manifest-path desktop/Cargo.toml
      - run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - run: cargo fmt --manifest-path desktop/Cargo.toml -- --check
      - run: cargo fmt --manifest-path tooling/verifier/Cargo.toml -- --check
