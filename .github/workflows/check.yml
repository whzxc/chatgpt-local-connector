name: Check
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format | Rust
        run: npm run check:format
      - name: Validation | Version
        run: npm run release:check
      - name: Cache | Rust dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: checks
          workspaces: |
            desktop -> target
            native -> target/contracts
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache | Rust hit=${{ steps.rust-cache.outputs.cache-hit }}
        run: echo "Rust cache lookup complete"
      - name: Dependencies | npm ci
        run: npm ci
      - name: Validation | Types
        run: npm run check
      - name: Tests | Contracts
        run: npm test
      - name: Frontend | Build
        run: npm run build
      - name: Native check | Desktop
        run: cargo check --manifest-path desktop/Cargo.toml
  timings:
    name: Timing summary
    if: always() && github.workflow == 'Check'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Generate phase timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/workflow-timing.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: workflow-timing
          path: ${{ runner.temp }}/workflow-timing/
          retention-days: 30
