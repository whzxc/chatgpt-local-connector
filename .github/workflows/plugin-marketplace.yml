name: Sync plugin marketplace
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published stable version to sync (without v)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: plugin-marketplace
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Read published release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view --json tagName --jq .tagName)" = "v$VERSION"
          test "$(gh release view "v$VERSION" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | any')" = false
          npm run release:check
          gh release download "v$VERSION" --pattern 'CLC.Plugin_*.zip' --pattern 'CLC.Core_*.bin*' --dir release-artifacts
      - name: Assemble verified release payloads
        run: npm run plugin:marketplace -- assemble release-artifacts dist/plugin-marketplace
      - uses: actions/checkout@v6
        with:
          repository: whzxc/clc-plugins
          ref: stable
          fetch-depth: 0
          ssh-key: ${{ secrets.PLUGIN_MARKETPLACE_DEPLOY_KEY }}
          path: dist/plugin-marketplace-repository
      - name: Publish stable and version tag
        run: npm run plugin:marketplace -- publish dist/plugin-marketplace dist/plugin-marketplace-repository
