name: Release
run-name: Release ${{ github.ref_name }} (${{ (github.event_name == 'push' || inputs.publish) && 'publish' || 'rehearsal' }})
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a version tag (false runs a build rehearsal only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    name: Release prerequisites
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      build-run: ${{ steps.artifacts.outputs.run-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gate | Require successful Check for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = true ]; then
            test "$GITHUB_REF_TYPE" = tag || { echo 'Publishing requires a version tag.'; exit 1; }
          fi
          result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs?head_sha=$GITHUB_SHA&event=workflow_dispatch&branch=main&per_page=1" --jq '.workflow_runs[0] | "\(.status):\(.conclusion)"')
          test "$result" = completed:success || { echo "Run Check manually on main for this exact commit before building: $result"; exit 1; }
      - name: Gate | Find verified build matching source and cask
        id: artifacts
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?event=workflow_dispatch&branch=main&status=success&per_page=100" --jq '.workflow_runs[] | [.id, .head_sha] | @tsv')
          while IFS=$'\t' read -r run_id source_sha; do
            [ -n "$run_id" ] || continue
            git cat-file -e "$source_sha^{commit}" 2>/dev/null || continue
            git diff --quiet "$source_sha" "$GITHUB_SHA" -- . ':!Casks/local-connector.rb' || continue
            metadata="$RUNNER_TEMP/release-metadata-$run_id"
            if ! gh run download "$run_id" --name release-metadata --dir "$metadata"; then
              continue
            fi
            if cmp -s Casks/local-connector.rb "$metadata/Casks/local-connector.rb"; then
              echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
              echo "Reusing verified build $run_id ($source_sha)."
              exit 0
            fi
          done <<< "$runs"
          echo 'No successful main rehearsal matches this source and committed Cask. Run a rehearsal, commit its Cask, and run Check before tagging.'
          exit 1
  build:
    needs: gate
    if: github.event_name == 'workflow_dispatch' && !inputs.publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'macOS'
        uses: astral-sh/setup-uv@v6
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin
      - name: Cache | Rust dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: desktop-${{ matrix.target }}
          key: path-remap-v1
          workspaces: |
            desktop -> target
            tooling/verifier -> target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache | Rust hit=${{ steps.rust-cache.outputs.cache-hit }}
        run: echo "Rust cache lookup complete"
      - name: Dependencies | npm ci
        run: npm ci
      - name: Validation | Release version
        run: npm run release:check
      - name: Frontend | Build
        run: npm run build
      - name: Package | Native build and signed installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --release --target '${{ matrix.target }}'
      - name: Verification | Native package
        if: runner.os == 'macOS'
        run: node tooling/check-package.mjs 'desktop/target/aarch64-apple-darwin/release/bundle/macos/Local Connector.app'
      - name: Verification | Stage and verify signatures
        run: npm run release:stage -- '${{ matrix.platform }}' 'desktop/target/${{ matrix.target }}/release/bundle' release-artifacts
      - name: Artifacts | Upload platform packages
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [gate, build]
    if: ${{ !cancelled() && needs.gate.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache | Verifier dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: release-verifier
          workspaces: tooling/verifier -> target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache | Rust hit=${{ steps.rust-cache.outputs.cache-hit }}
        run: echo "Rust cache lookup complete"
      - name: Artifacts | Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*-*
          github-token: ${{ github.token }}
          run-id: ${{ needs.gate.outputs.build-run || github.run_id }}
          path: release-artifacts
          merge-multiple: true
      - name: Metadata | Finalize and verify all signatures
        run: npm run release:finalize -- release-artifacts
      - name: Verification | Committed cask matches the built DMG
        if: github.event_name == 'push' || inputs.publish
        run: git diff --exit-code -- Casks/local-connector.rb
      - name: Artifacts | Upload rehearsal metadata
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            release-artifacts/latest.json
            release-artifacts/SHA256SUMS.txt
            release-artifacts/release-notes.md
            Casks/local-connector.rb
          retention-days: 14
      - name: Publish | Upload draft and publish
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true || { echo 'Published releases are immutable; bump the version.'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Local Connector $GITHUB_REF_NAME" --notes-file release-artifacts/release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" release-artifacts/*.dmg release-artifacts/*.gz release-artifacts/*.msi release-artifacts/*.exe release-artifacts/*.sig release-artifacts/SHA256SUMS.txt release-artifacts/latest.json --clobber
          gh release edit "$GITHUB_REF_NAME" --notes-file release-artifacts/release-notes.md --draft=false --latest
      - name: Verification | Public downloads
        if: github.event_name == 'push' || inputs.publish
        run: node tooling/release.mjs verify-published release-artifacts
  timings:
    name: Timing summary
    if: always()
    needs: [gate, build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Generate phase timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/workflow-timing.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: workflow-timing
          path: ${{ runner.temp }}/workflow-timing/
          retention-days: 30
