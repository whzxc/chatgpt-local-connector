[package]
name = "local-connector-desktop"
version = "0.4.2"
edition = "2021"
license = "MIT"

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "~2.11.0"
serde_json = "1"
connector-core = { path = "../native" }
tokio = { version = "1", features = ["full"] }
dirs = "6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSView", "NSWindow", "NSButton", "NSResponder", "NSControl"] }
