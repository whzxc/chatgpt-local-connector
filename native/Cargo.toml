[package]
name = "connector-core"
version = "0.8.5"
edition = "2021"
license = "MIT"

[features]
# Compiled only by the existing isolated contract fixture, never desktop builds.
test-fixture = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
sha2 = "0.10"
base64 = "0.22"
dirs = "6"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls-no-provider"] }
jsonschema = { version = "0.33", default-features = false }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[profile.dev]
debug = 1
incremental = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
