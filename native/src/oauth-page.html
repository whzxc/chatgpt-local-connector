<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Local Connector · OAuth</title>
  {{reload}}
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#243c35;background:#e8eeeb;color-scheme:light dark;--surface:#fff;--muted:#74827c;--line:#dbe5df;--accent:#306354}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px 20px;background:radial-gradient(ellipse at 50% 20%,#f8fbf8 0,transparent 65%)}
    main{width:100%;max-width:540px;padding:44px 36px 32px;background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:0 20px 65px #203c3512;text-align:center}
    .brand{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;font-weight:600;letter-spacing:.1px}
    .mark{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--accent);color:white;font-size:22px;line-height:1}
    .badge{margin-left:2px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;color:var(--muted);font-size:10px;letter-spacing:.6px}
    h1{margin:34px 0 14px;font-size:28px;letter-spacing:-.8px;font-weight:600}
    p{margin:0;line-height:1.7;font-size:14px}
    .detail{margin:6px auto 0;max-width:360px;color:var(--muted);font-size:12px}
    .status{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--accent)}
    .dot{width:7px;height:7px;background:var(--accent);border-radius:50%}
    .footnote{margin-top:18px;color:var(--muted);font-size:12px}
    footer{margin-top:30px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
    @media(max-width:420px){main{padding:32px 20px 24px}h1{font-size:24px}}
    @media(prefers-color-scheme:dark){:root{color:#e1ece6;background:#15211d;--surface:#1e2d26;--muted:#9aada3;--line:#35463d;--accent:#9dceb4}body{background:radial-gradient(ellipse at 50% 20%,#2b4034 0,transparent 65%)}.mark{color:#1e2d26}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">↔</span>Local Connector<span class="badge">OAuth</span></div>
    <h1>{{title}}</h1>
    <p>{{description}}</p>
    <p class="detail" lang="en">{{detail}}</p>
    {{content}}
    <footer>Local Connector · 由本机确认连接</footer>
  </main>

</body>
</html>
