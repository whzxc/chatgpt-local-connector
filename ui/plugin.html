<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Connector 用量工作台</title>
  </head>
  <body>
    <div id="root"><p id="plugin-loading" role="status" style="padding:24px;font:14px system-ui">正在加载 Connector 用量工作台…</p></div>
    <script>
      function showPluginLoadError() {
        const status = document.getElementById('plugin-loading');
        if (!status) return;
        status.setAttribute('role', 'alert');
        status.textContent = '开发界面加载失败。请确认 npm run plugin:dev 正在运行，然后关闭并重新打开面板。';
      }
      window.addEventListener('error', showPluginLoadError, true);
      window.addEventListener('unhandledrejection', showPluginLoadError);
      setTimeout(showPluginLoadError, 10000);
    </script>
    <script type="module" src="/usage-insights/main.tsx"></script>
  </body>
</html>
